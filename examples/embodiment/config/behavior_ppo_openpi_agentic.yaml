# Dual-system (VLM + VLA) embodied eval config.
#
# Extends behavior_ppo_openpi_pi05_eval.yaml with:
#   - vlm: Qwen2.5-VL model settings (loaded on the rollout GPU alongside VLA)
#
# The VLM and VLA share the rollout GPU — no separate "agentloop" component.
# All components (actor, env, rollout) are collocated for eval-only.

defaults:
  - env/behavior_r1pro@env.train
  - env/behavior_r1pro@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env: 0-1
    rollout: 2-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_ppo_openpi_agentic"
    logger_backends: ["tensorboard"]

  only_eval: True

  max_epochs: 1000
  max_steps: 1

  val_check_interval: -1
  save_interval: 40
  seq_length: 4096
  max_prompt_length: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 2
  eval_rollout_epoch: 2

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 4
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/train
      fps: 15
  eval:
    total_num_envs: 8
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: /mnt/public/xzxuan/models/ckpt/jax_skill
    precision: ${actor.model.precision}

# VLM (Qwen2.5-VL) settings — loaded on the rollout GPU alongside the VLA.
vlm:
  log_subtasks: False
  # 3-flag system (must match SFT training config):
  enable_reasoning: true
  enable_memory: true
  simple_skill: true
  # Number of observation images to save per trajectory (-1 = all, 0 = none).
  k_images: -1
  # How many run_step() calls between successive VLM invocations.
  # 1 = call the VLM every step (default). N>1 calls the VLM once every N
  # steps and reuses the cached subtask for the remaining (N-1) steps; the
  # JSONL still records one VLM entry per turn, with skip=True for reuses.
  frequency: 5

  # VLM generation / sampling parameters.
  sampling_params:
    do_sample: True
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    repetition_penalty: 1.0
    max_new_tokens: 512

  model:
    model_type: "qwen2.5_vl_embodied"
    model_path: /mnt/public/xzxuan/models/ckpt/qwen2_5_vl_sft_agentic
    # /mnt/public/xzxuan/models/ckpt/behavior/qwen2_5_vl_behavior_skill_step1000
    # /mnt/public/xzxuan/models/Qwen2.5-VL-3B-Instruct
    # model_type: "qwen3_vl_embodied"
    # model_path: /mnt/public/xzxuan/models/Qwen3-VL-4B-Thinking
    precision: "bf16"
    is_lora: False
    # Qwen2.5-VL image resolution hints (controls visual token count).
    min_pixels: 3136    # 56 * 56
    max_pixels: 12845056  # 1280 * 28 * 28

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  num_steps: 10
  enable_offload: True

  model:
    model_path: ${rollout.model.model_path}
    add_value_head: True
    num_images_in_input: 3
    proprio_dim: 32
    action_dim: 23
    num_action_chunks: 32
    openpi:
      config_name: "pi05_behavior"
      detach_critic_input: True
      joint_logprob: False
      noise_level: 0.0
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"
      max_token_len: 300

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
