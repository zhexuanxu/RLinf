# Dual-system (VLM + VLA) embodied eval config.
#
# Extends behavior_ppo_openpi_pi05.yaml with:
#   - vlm: Qwen2.5-VL model settings (loaded on the rollout GPU alongside VLA)
#
# The VLM and VLA share the rollout GPU — no separate "agentloop" component.
# The standard `actor, env, rollout` placement is used.

defaults:
  - env/behavior_r1pro@env.train
  - env/behavior_r1pro@env.eval
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env: 0-1
    rollout: 2-3

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "qwen2.5"
    logger_backends: ["tensorboard"]

  max_epochs: 1
  max_steps: -1

  only_eval: True
  val_check_interval: -1
  save_interval: 40
  seq_length: 4096
  max_prompt_length: 50

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 16
  eval_rollout_epoch: 2

  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level

  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"

  train:
    total_num_envs: 2
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
  eval:
    total_num_envs: 2
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1

  model:
    model_path: /mnt/public/daibo/models/pi05_b1kpt50_pt
    precision: ${actor.model.precision}

# VLM (Qwen2.5-VL) settings — loaded on the rollout GPU alongside the VLA.
vlm:
  log_subtasks: False
  # Enable MEM-style language memory (pi_HL(l, m | o, m_prev, g)).
  # When False, the VLM outputs only a subtask (memoryless mode).
  enable_memory: True
  # Number of observation images to save per trajectory (-1 = all, 0 = none).
  k_images: -1

  # VLM generation / sampling parameters.
  sampling_params:
    do_sample: True
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    repetition_penalty: 1.0
    max_new_tokens: 512

  model:
    model_type: "qwen2.5_vl_embodied"
    model_path: /mnt/public/new_fuxu/Qwen2.5-VL-3B-Instruct
    # model_type: "qwen3_vl_embodied"
    # model_path: /mnt/public/xzxuan/models/Qwen3-VL-4B-Thinking    
    precision: "bf16"
    is_lora: False
    # Qwen2.5-VL image resolution hints (controls visual token count).
    min_pixels: 3136    # 56 * 56
    max_pixels: 12845056  # 1280 * 28 * 28

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 16
  seed: 1234
  num_steps: 10
  enable_offload: True

  model:
    model_path: /mnt/public/daibo/models/pi05_b1kpt50_pt
    add_value_head: True
    num_images_in_input: 3
    proprio_dim: 32
    action_dim: 23
    num_action_chunks: 32
    openpi:
      config_name: "pi05_behavior"
      detach_critic_input: True
      joint_logprob: False
      noise_level: 0.5
      action_env_dim: ${actor.model.action_dim}
      noise_method: "flow_sde"

  optim:
    lr: 1.0e-4
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0
    weight_decay: 0.01
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
