defaults:
  - env/behavior_r1pro@env.train
  - env/behavior_r1pro@env.eval
  - model/pi0_5_pytorch@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# ---------------------------------------------------------------------------
# DATASET-ACTION REPLAY (joint_absolute / 23-dim).
# Instead of the actor generating actions, the env worker feeds the recorded
# 23-dim joint actions of the episode whose cached tro_state initial state the
# env resets to (activity_instance_id=k  <->  episode_index=10*k). The actor
# still runs over the channel (its output is discarded). Verifies the original
# absolute-joint dataset actions reproduce the demonstrated task in-sim.
# ---------------------------------------------------------------------------

cluster:
  num_nodes: 1
  component_placement:
    # Single GPU: replay uses one env (one episode per epoch), so env_world_size
    # must be 1 to divide total_num_envs=1.
    rollout,env,actor: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_replay_joint"
    logger_backends: ["tensorboard"]
  only_eval: True
  max_epochs: 1000
  max_steps: 1
  val_check_interval: -1
  save_interval: 40
  seq_length: 4096
  max_prompt_length: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 1
  rollout_epoch: 2
  # One epoch per replayed episode (instances 1..5 -> episodes 10,20,30,40,50).
  eval_rollout_epoch: 5
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  train:
    total_num_envs: 1
    max_episode_steps: 2560
    max_steps_per_rollout_epoch: 2560
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/train
      fps: 15
  eval:
    # Single env: epoch e deterministically resets to activity_instances[e], so
    # feeding episode 10*instance_id[e] stays aligned with the reset state.
    total_num_envs: 1
    max_episode_steps: 2560
    max_steps_per_rollout_epoch: 2560
    # Render every control step (not just the last of each chunk) for smooth video.
    skip_intermediate_obs_in_chunk: False
    video_cfg:
      save_video: True
      info_on_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15
    # Feed recorded dataset actions instead of actor output (env-worker override).
    replay:
      enabled: True
      dataset_root: /mnt/public/xzxuan/data/2025-challenge-demos
      episode_stride: 10
    omni_config:
      env:
        action_frequency: 30
        physics_frequency: 240
        rendering_frequency: 30
      task:
        activity_instance_dir: ${oc.env:OMNIGIBSON_DATA_PATH}/2025-challenge-task-instances/scenes/house_double_floor_lower/json/house_double_floor_lower_task_turning_on_radio_instances
        activity_instance_id: [1, 2, 3, 4, 5]
        instance_file_format: tro_state
        instance_resample_mode: offline
        online_object_sampling: False
        use_presampled_robot_pose: True
        reward_config:
          reward_mode: task
          task_specific_reward_name: turning_on_radio
      scene:
        load_room_types: ["living_room", "kitchen"]
        partial_scene_load: false

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    # Base pi05 checkpoint (new format). In replay the actor output is discarded,
    # so this only needs to load; it does not affect the executed actions.
    model_path: /mnt/public/xzxuan/models/pi05_base_pytorch_new
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 64
  seed: 1234
  enable_offload: True
  model:
    model_path: ${rollout.model.model_path}
    add_value_head: False
    num_images_in_input: 3
    proprio_dim: 32
    num_action_chunks: 32
    openpi:
      action_env_dim: ${actor.model.action_dim}
      assets_dir: /mnt/public/xzxuan/repos/RLinf/outputs/norm_stats
      asset_id: turn_on_radio_reorder
      paligemma_tokenizer: /mnt/public/xzxuan/models/paligemma_tokenizer/paligemma_tokenizer.model
      discrete_state_input: true
      state_token: align
      control_mode: joint_absolute
  optim:
    lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    clip_grad: 10.0
    weight_decay: 0.01
    critic_warmup_steps: 0
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
