model_type: "openpi_pytorch"

# Model-shape template only. The real filesystem paths (model_path and the
# openpi.assets_dir / openpi.asset_id / openpi.paligemma_tokenizer below) are set
# in the eval experiment config (behavior_ppo_openpi_pi05_pytorch_eval.yaml); the
# values here are placeholders so this template stays path-free and reusable.

# Weight dtype for eval: bf16. (SFT keeps an fp32 master; see the SFT template.)
precision: bf16

# LoRA is not used for eval, but the shared model factory reads these keys.
is_lora: False
lora_rank: 32

# Action and chunk settings (BEHAVIOR pi05). `num_action_chunks` is the Pi0
# action_horizon. The semantic action_dim is DERIVED from openpi.control_mode via
# openpi.control_mode_action_dims below, so control_mode is the single switch (no
# separate action_dim edit per mode).
num_action_chunks: 32
action_dim: ${actor.model.openpi.control_mode_action_dims.${actor.model.openpi.control_mode}}
use_proprio: True

# Number of flow-matching denoising steps for eval action sampling. The model is
# tuned for this step count and the action-parity gate holds at equal num_steps.
num_steps: 5

# No value head in the eval-only model.
add_value_head: False

# openpi_pytorch model-shape parameters. get_model builds Pi0Config from
# num_action_chunks (action_horizon) + the openpi.* shape fields; no config.json
# is read. assets_dir/asset_id/paligemma_tokenizer are placeholders resolved in
# the eval experiment config.
openpi:
  num_images_in_input: 3
  action_chunk: ${actor.model.num_action_chunks}
  num_steps: ${actor.model.num_steps}
  action_env_dim: ${actor.model.action_dim}
  # Selects the per-env eval processor
  # (rlinf.data.datasets.openpi_pytorch.get_eval_processer).
  env: behavior
  # Pi0 model shape: padded action dim, LLM/expert variants, prompt token budget.
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200
  # pi05 state injection: true discretizes normalized state into the language
  # prompt; false uses image + text only. pi0 suffix-state injection is a
  # different model structure and is not selected by this pi0_5 template.
  discrete_state_input: true
  # Prompt state channel layout. Canonical key: state_token (abs_joint_old /
  # abs_joint / abs_eef); the legacy state_order (comet / align) still resolves.
  # abs_eef makes the state arms base-frame [pos, axisangle], consistent with the
  # eef action space. MUST match the state_token the norm stats were built with.
  state_token: abs_joint_old
  # Robot action space (single switch). "joint_absolute": 23-dim absolute joints.
  # "absolute_eef": arms become 6-DoF base-frame ABSOLUTE EEF pose [pos,axisangle]
  # (OmniGibson IK absolute_pose) -> 21-dim. "delta_eef": arms are state-to-state
  # EEF deltas (IK pose_delta_ori) -> 21-dim. "eef_delta_pose": legacy FK-based
  # delta -> 21-dim. validate_embodied_cfg maps EEF modes onto the R1Pro arm
  # controllers, so eval need only set this field (not hand-edit controller_config).
  control_mode: joint_absolute
  # control_mode -> semantic action_dim map (action_dim above interpolates this).
  control_mode_action_dims:
    joint_absolute: 23
    absolute_eef: 21
    delta_eef: 21
    eef_delta_pose: 21
  # Placeholders — set the real norm-stats + tokenizer locations in the eval
  # experiment config.
  assets_dir: "/path/to/assets"
  asset_id: "behavior-1k/2025-challenge-demos"
  paligemma_tokenizer: "/path/to/paligemma_tokenizer.model"
