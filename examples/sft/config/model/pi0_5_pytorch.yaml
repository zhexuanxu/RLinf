model_type: "openpi_pytorch"

# Model-shape template only. Filesystem paths (model_path, openpi.assets_dir,
# and openpi.asset_id) live in the experiment config (behavior_pi05_vla.yaml),
# not here, so this template stays path-free and reusable.

# Weight dtype for SFT: fp32. The fp32 weights are the FSDP optimizer master; FSDP
# MixedPrecision casts params to bf16 only for compute (param_dtype is a separate
# knob in the experiment config), so warmup-LR updates are not lost to bf16
# rounding. (Eval casts the weights to bf16; see the embodiment template.)
precision: fp32

# LoRA is not used, but the shared model factory reads these keys.
is_lora: False
lora_rank: 32

# Action and chunk settings (BEHAVIOR pi05). ``control_mode`` below is the
# single public switch for the semantic environment action width; the model
# still pads every mode to ``openpi.model_action_dim``.
num_action_chunks: 32
action_dim: ${.openpi.control_mode_action_dims.${.openpi.control_mode}}
use_proprio: True

# Flow-matching denoising steps (used by the eval sampler; carried here so the
# shared factory reads one uniform field).
num_steps: 5

# No value head in the SFT model.
add_value_head: False

# openpi_pytorch model-shape parameters (clean/minimal: no full_pi05, dsrl,
# value-head, RL). get_model builds Pi0Config from num_action_chunks
# (action_horizon) + the openpi.* shape fields below; no config.json is read.
openpi:
  # Concrete openpi_pytorch variant: eval / sft / rl. This template feeds SFT
  # experiments, so it defaults to `sft`.
  task: sft
  # openpi TrainConfig key selecting the shared transform pipeline
  # (rlinf.models.embodiment.openpi.dataconfig.get_openpi_config). Also the env
  # selector for the SFT dataloader registry. The SFT data loader and the eval/RL
  # model factory both build their transforms from it.
  config_name: "pi05_behavior"
  num_images_in_input: 3
  action_chunk: ${..num_action_chunks}
  action_env_dim: ${..action_dim}
  # Pi0 model shape: padded action dim, LLM/expert variants, prompt token budget.
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200
  # Public π₀.₅ BEHAVIOR selectors. ``state_token`` accepts exactly ``none``,
  # ``abs_joint_old``, ``abs_joint``, or ``abs_eef``. ``none`` disables
  # prompt-state injection; preprocessing retains the ``abs_joint_old`` layout
  # only for normalization/checkpoint compatibility.
  #
  # ``control_mode`` accepts exactly ``abs_joint``, ``delta_joint``,
  # ``abs_eef``, or ``delta_eef``. It selects the expected dataset action
  # semantics and semantic action width. Generic ``assets_dir`` / ``asset_id``
  # must point to matching norm stats.
  mode: vla
  state_token: abs_joint_old
  control_mode: abs_joint
  control_mode_action_dims:
    abs_joint: 23
    delta_joint: 23
    abs_eef: 21
    delta_eef: 21
  language_loss_weight: 1.0
  action_loss_weight: 1.0
  stop_gradient_to_vlm: false
  max_new_tokens: 24
  language_temperature: 0.0
