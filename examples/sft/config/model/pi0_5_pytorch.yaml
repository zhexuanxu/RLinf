model_type: "openpi_pytorch"

# Model-shape template only. Filesystem paths (model_path, openpi.assets_dir,
# openpi.asset_id) live in the experiment config (behavior_pi05_vla.yaml), not
# here, so this template stays path-free and reusable.

# Load the fp32 new-format base for training. This selects the training build
# path (strict fp32 load kept as the FSDP optimizer master + gradient
# checkpointing; FSDP MixedPrecision casts params to bf16 only for compute),
# distinct from the bf16-strict eval loader.
load_for_training: True

# bf16 COMPUTE precision (FSDP MixedPrecision param_dtype). Training keeps fp32
# master weights — the model is NOT cast to bf16 (so warmup-LR optimizer updates
# are not lost to bf16 rounding); only eval casts the params to bf16.
precision: "bf16"

# LoRA is not used, but the shared model factory reads these keys.
is_lora: False
lora_rank: 32

# Action and chunk settings (BEHAVIOR pi05): 23-dim env actions, 32-step chunk
# (action_horizon). `num_action_chunks` is the Pi0 action_horizon.
num_action_chunks: 32
action_dim: 23
use_proprio: True

# No value head in the SFT model.
add_value_head: False

# openpi_pytorch model-shape parameters (clean/minimal: no full_pi05, dsrl,
# value-head, RL). get_model builds Pi0Config from num_action_chunks
# (action_horizon) + the openpi.* shape fields below; no config.json is read.
openpi:
  num_images_in_input: 3
  action_chunk: ${actor.model.num_action_chunks}
  action_env_dim: ${actor.model.action_dim}
  # Pi0 model shape: padded action dim, LLM/expert variants, prompt token budget.
  model_action_dim: 32
  paligemma_variant: "gemma_2b"
  action_expert_variant: "gemma_300m"
  max_token_len: 200
