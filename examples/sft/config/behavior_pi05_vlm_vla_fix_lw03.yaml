defaults:
  - model/pi0_5_pytorch@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sft_behavior_pi05_vlm_vla_fix_lw03_sgTrue"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  # Set this to your local BEHAVIOR streaming dataset folder (the
  # 2025-challenge-demos repo folder). The streaming loader reads its remaining
  # parameters from this section directly (no hidden defaults).
  train_data_paths: /mnt/public/xzxuan/data/2025-challenge-demos
  behavior_dataset_root: /mnt/public/xzxuan/data/2025-challenge-demos
  repo_id: "behavior-1k/2025-challenge-demos"
  modalities: ["rgb"]
  num_workers: 8
  # Subtask supervision: each frame carries the main task as the prompt plus
  # the subtask label (resolved from the episode's skill annotation) as the
  # VLM response. Level 1 requires mode: vlm_vla below and task_subtasks.
  fine_grained_level: 1
  # Gap frames between two skill windows belong to the NEXT skill when true
  # (the default); when false they are not used for training. Frames outside
  # the annotation's valid_duration and trailing gaps are never used.
  enable_gap: true
  tolerance_s: 1.0e-4
  # BEHAVIOR task-0000 with its four ordered subtask labels, indexed by the
  # annotation's skill_idx.
  tasks: ["turning_on_radio"]
  task_subtasks:
    turning_on_radio:
      - "move to radio"
      - "pick up radio from coffee table"
      - "press radio"
      - "place radio on coffee table"

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  eval_batch_size: 1
  global_batch_size: 256
  seed: 42

  # actor.model comes from `defaults: model/pi0_5_pytorch@actor.model` (the
  # path-free shape template). The experiment config supplies the filesystem
  # paths and the vlm_vla mode knobs.
  model:
    # New-format fp32 base checkpoint (exactly what the reference trainer loads).
    model_path: /mnt/public/xzxuan/models/pi05_base_pytorch_new
    openpi:
      # Quantile-normalization stats for the 2025-challenge-demos BEHAVIOR task
      # 0000, resolved as {assets_dir}/{asset_id}/norm_stats.json (the same
      # canonical stats the eval path resolves).
      assets_dir: /mnt/public/xzxuan/repos/openpi-comet-pytorch-mixed/outputs/assets/train/pi05_b1k-task0000_sft_pytorch_mixed
      asset_id: "behavior-1k/2025-challenge-demos"
      # PaliGemma SentencePiece tokenizer model (resolved from YAML, not hardcoded
      # in code).
      paligemma_tokenizer: /mnt/public/xzxuan/models/paligemma_tokenizer/paligemma_tokenizer.model
      # VLM token output: the SFT loss is
      #   language_loss_weight * subtask CE + action_loss_weight * flow matching
      # and eval generates the subtask (greedy, up to max_new_tokens) before
      # denoising actions. stop_gradient_to_vlm keeps the flow gradient inside
      # the action expert (the CE loss still trains the full VLM).
      mode: vlm_vla
      # Root-cause fix (docs/plan-phase8-optimize.md): with both weights at 1.0
      # the subtask CE gradient dominated the single global grad-norm clip and
      # throttled the action-expert update to ~0.4x every step (gradient-norm
      # audit on the broken checkpoint). Down-weighting the CE term relieves that
      # coupling (the combined grad norm drops well under clip_grad, so the action
      # expert trains at full strength) while the subtask is still learned
      # (probe: language_acc 0.99 at lw=0.1). stop_gradient_to_vlm keeps the flow
      # gradient inside the action expert (knowledge insulation).
      language_loss_weight: 0.3
      action_loss_weight: 1.0
      stop_gradient_to_vlm: True
      max_new_tokens: 24
      language_temperature: 0.0

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    # Reference-exact warmup+cosine: warmup starts at peak/(warmup+1) and cosine
    # decays to min_lr over total_training_steps (matches openpi-comet-pytorch-mixed).
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    # FULL_SHARD across ranks, matching the reference trainer (degenerates to a
    # single shard on 1 GPU). FSDP MixedPrecision casts params to bf16 for compute;
    # gradient checkpointing is enabled on the dual-expert Gemma + SigLIP.
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      # Match the reference recipe (init_model fsdp1 branch:
      # MixedPrecision(param_dtype=bf16, reduce_dtype=fp32)): bf16 compute, but the
      # gradient all-reduce and buffers stay fp32 so multi-rank grad accumulation is
      # not rounded to bf16. param_dtype is the FSDP COMPUTE dtype and is set
      # explicitly (bf16) rather than interpolated from actor.model.precision: the
      # load-dtype selector and the compute dtype are separate knobs, and coupling
      # them is a footgun (an fp32-master load must still compute in bf16).
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
