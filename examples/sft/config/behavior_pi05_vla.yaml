defaults:
  - model/pi0_5_pytorch@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sft_behavior_pi05_vla"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  max_steps: 30000
  val_check_interval: -1
  save_interval: 1000

data:
  train_data_paths: "/mnt/public/xzxuan/data/2025-challenge-demos"

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 256
  seed: 42

  # actor.model is provided by `defaults: model/pi0_5_pytorch@actor.model`
  # (self-contained openpi_pytorch, fp32 new-format base cast to bf16). No
  # full_pi05 / dsrl / value-head overrides here — those paths are unsupported.

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    # Reference-exact warmup+cosine: warmup starts at peak/(warmup+1) and cosine
    # decays to min_lr over total_training_steps (matches openpi-comet-pytorch-mixed).
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    # FULL_SHARD across ranks, matching the reference trainer (degenerates to a
    # single shard on 1 GPU). The model casts params to bf16; gradient
    # checkpointing is enabled on the dual-expert Gemma + SigLIP.
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
