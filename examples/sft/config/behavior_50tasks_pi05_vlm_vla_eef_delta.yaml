defaults:
  - model/pi0_5_pytorch@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sft_behavior_50tasks_pi05_vlm_vla_eef_delta"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  max_steps: 50000
  val_check_interval: -1
  save_interval: 10000

data:
  # Single-switch routing: base fields point at the ORIGINAL joint dataset; the
  # *_eef_delta fields point at the converted all-50 delta-EEF dataset.
  # control_mode (actor.model.openpi.control_mode) selects which set the loader
  # reads via resolve_behavior_paths. Both predeclared so flipping control_mode
  # routes the dataset without hand-editing paths. Build the delta dataset+stats
  # once with toolkits/eval_scripts_openpi/convert_all_50_to_eef_delta.sh.
  train_data_paths: /mnt/public/xzxuan/data/2025-challenge-demos
  behavior_dataset_root: /mnt/public/xzxuan/data/2025-challenge-demos
  train_data_paths_eef_delta: /mnt/public/xzxuan/data/2025-challenge-demos-eef-delta
  behavior_dataset_root_eef_delta: /mnt/public/xzxuan/data/2025-challenge-demos-eef-delta
  repo_id: "behavior-1k/2025-challenge-demos"
  modalities: ["rgb"]
  num_workers: 8
  # Delta-specific Arrow cache (the 21-dim converted parquet re-encodes to its own
  # cache; kept separate from the 23-dim joint cache to avoid any cross-reuse).
  hf_cache_dir: /mnt/public/xzxuan/.cache/hf_datasets_eef_delta
  # Subtask supervision: each frame carries the main task as the prompt plus the
  # subtask label (resolved from the episode's skill annotation) as the VLM
  # response. Level 1 requires mode: vlm_vla below.
  fine_grained_level: 1
  enable_gap: false
  tolerance_s: 1.0e-4
  # All 50 BEHAVIOR tasks, ordered by canonical task index. Subtask text per frame
  # is resolved at load time from that frame's own episode skill annotation.
  tasks:
    - "turning_on_radio"
    - "picking_up_trash"
    - "putting_away_Halloween_decorations"
    - "cleaning_up_plates_and_food"
    - "can_meat"
    - "setting_mousetraps"
    - "hiding_Easter_eggs"
    - "picking_up_toys"
    - "rearranging_kitchen_furniture"
    - "putting_up_Christmas_decorations_inside"
    - "set_up_a_coffee_station_in_your_kitchen"
    - "putting_dishes_away_after_cleaning"
    - "preparing_lunch_box"
    - "loading_the_car"
    - "carrying_in_groceries"
    - "bringing_in_wood"
    - "moving_boxes_to_storage"
    - "bringing_water"
    - "tidying_bedroom"
    - "outfit_a_basic_toolbox"
    - "sorting_vegetables"
    - "collecting_childrens_toys"
    - "putting_shoes_on_rack"
    - "boxing_books_up_for_storage"
    - "storing_food"
    - "clearing_food_from_table_into_fridge"
    - "assembling_gift_baskets"
    - "sorting_household_items"
    - "getting_organized_for_work"
    - "clean_up_your_desk"
    - "setting_the_fire"
    - "clean_boxing_gloves"
    - "wash_a_baseball_cap"
    - "wash_dog_toys"
    - "hanging_pictures"
    - "attach_a_camera_to_a_tripod"
    - "clean_a_patio"
    - "clean_a_trumpet"
    - "spraying_for_bugs"
    - "spraying_fruit_trees"
    - "make_microwave_popcorn"
    - "cook_cabbage"
    - "chop_an_onion"
    - "slicing_vegetables"
    - "chopping_wood"
    - "cook_hot_dogs"
    - "cook_bacon"
    - "freeze_pies"
    - "canning_food"
    - "make_pizza"

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  eval_batch_size: 1
  global_batch_size: 256
  seed: 42

  model:
    model_path: /mnt/public/xzxuan/models/pi05_base_pytorch_new
    # Delta-EEF is a 21-dim action space (both arms 6-DoF EEF deltas). The model
    # still pads to openpi.model_action_dim (32); only the meaningful width is 21.
    action_dim: 21
    openpi:
      # Single-switch routing (see data: above). Base assets_dir/asset_id point at
      # the ORIGINAL 50-task joint stats; the *_eef_delta fields point at the
      # all-50 delta-EEF stats (convert_all_50_to_eef_delta.sh step 2/2). Both
      # predeclared; control_mode selects which set.
      assets_dir: /mnt/public/xzxuan/repos/RLinf/outputs/norm_stats
      asset_id: 50tasks_reorder
      assets_dir_eef_delta: /mnt/public/xzxuan/repos/RLinf/outputs/norm_stats
      asset_id_eef_delta: 50tasks_eef_delta
      # State is still the recorded 23-dim proprio; "align" pairs with the
      # delta-EEF stats generated with --state-order align.
      state_order: align
      # Delta end-effector control (21-dim). See model/pi0_5_pytorch.yaml.
      control_mode: eef_delta_pose
      paligemma_tokenizer: /mnt/public/xzxuan/models/paligemma_tokenizer/paligemma_tokenizer.model
      discrete_state_input: true
      # vlm_vla supervision sequence over 50 tasks reaches 257 tokens worst case;
      # 288 covers it with headroom (see the joint 50-task vlm_vla config).
      max_token_len: 288
      mode: vlm_vla
      language_loss_weight: 1.0
      action_loss_weight: 10
      stop_gradient_to_vlm: False
      max_new_tokens: 24
      language_temperature: 0.0

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 50000
    lr_warmup_steps: 2000
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
