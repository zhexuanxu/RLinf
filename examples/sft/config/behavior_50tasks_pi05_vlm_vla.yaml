defaults:
  - model/pi0_5_pytorch@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sft_behavior_50tasks_pi05_vlm_vla"
    logger_backends: ["tensorboard"]

  max_epochs: 20
  max_steps: 50000
  val_check_interval: -1
  save_interval: 10000

data:
  # Set this to your local BEHAVIOR streaming dataset folder (the
  # 2025-challenge-demos repo folder). The streaming loader reads its remaining
  # parameters from this section directly (no hidden defaults).
  train_data_paths: /mnt/public/xzxuan/data/2025-challenge-demos
  behavior_dataset_root: /mnt/public/xzxuan/data/2025-challenge-demos
  repo_id: "behavior-1k/2025-challenge-demos"
  modalities: ["rgb"]
  num_workers: 8
  # Directory for the on-disk Arrow cache that datasets.load_dataset materializes
  # from the low-dim parquet before training. It re-encodes a full copy (~140 GB
  # for all 50 tasks); the HuggingFace default lands under HF_HOME on the small
  # container overlay (a few GB free) and overflows with "No space left on
  # device". Point it at the large /mnt/public volume. The cache is built once and
  # reused across ranks and subsequent runs. (Videos are decoded on the fly from
  # the dataset's videos/ and are unaffected.)
  hf_cache_dir: /mnt/public/xzxuan/.cache/hf_datasets
  # Subtask supervision: each frame carries the main task as the prompt plus
  # the subtask label (resolved from the episode's skill annotation) as the
  # VLM response. Level 1 requires mode: vlm_vla below.
  fine_grained_level: 1
  # Gap frames between two skill windows belong to the NEXT skill when true
  # (the default); when false they are not used for training. Frames outside
  # the annotation's valid_duration and trailing gaps are never used.
  enable_gap: false
  tolerance_s: 1.0e-4
  # All 50 BEHAVIOR tasks, listed explicitly and ordered by their canonical task
  # index (the keys of TASK_NAMES_TO_INDICES in behavior_sft_dataset.py). The
  # subtask text for every frame is resolved at load time from that frame's own
  # episode skill annotation, so no per-task subtask list is configured here.
  tasks:
    - "turning_on_radio"
    - "picking_up_trash"
    - "putting_away_Halloween_decorations"
    - "cleaning_up_plates_and_food"
    - "can_meat"
    - "setting_mousetraps"
    - "hiding_Easter_eggs"
    - "picking_up_toys"
    - "rearranging_kitchen_furniture"
    - "putting_up_Christmas_decorations_inside"
    - "set_up_a_coffee_station_in_your_kitchen"
    - "putting_dishes_away_after_cleaning"
    - "preparing_lunch_box"
    - "loading_the_car"
    - "carrying_in_groceries"
    - "bringing_in_wood"
    - "moving_boxes_to_storage"
    - "bringing_water"
    - "tidying_bedroom"
    - "outfit_a_basic_toolbox"
    - "sorting_vegetables"
    - "collecting_childrens_toys"
    - "putting_shoes_on_rack"
    - "boxing_books_up_for_storage"
    - "storing_food"
    - "clearing_food_from_table_into_fridge"
    - "assembling_gift_baskets"
    - "sorting_household_items"
    - "getting_organized_for_work"
    - "clean_up_your_desk"
    - "setting_the_fire"
    - "clean_boxing_gloves"
    - "wash_a_baseball_cap"
    - "wash_dog_toys"
    - "hanging_pictures"
    - "attach_a_camera_to_a_tripod"
    - "clean_a_patio"
    - "clean_a_trumpet"
    - "spraying_for_bugs"
    - "spraying_fruit_trees"
    - "make_microwave_popcorn"
    - "cook_cabbage"
    - "chop_an_onion"
    - "slicing_vegetables"
    - "chopping_wood"
    - "cook_hot_dogs"
    - "cook_bacon"
    - "freeze_pies"
    - "canning_food"
    - "make_pizza"

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  eval_batch_size: 1
  global_batch_size: 256
  seed: 42

  # actor.model comes from `defaults: model/pi0_5_pytorch@actor.model` (the
  # path-free shape template). The experiment config supplies the filesystem
  # paths and the vlm_vla mode knobs.
  model:
    # New-format fp32 base checkpoint (exactly what the reference trainer loads).
    model_path: /mnt/public/xzxuan/models/pi05_base_pytorch_new
    openpi:
      # Quantile-normalization stats computed over all 50 BEHAVIOR tasks with the
      # action-aligned state order, resolved as {assets_dir}/{asset_id}/norm_stats.json
      # (the same canonical stats the eval path resolves).
      assets_dir: /mnt/public/xzxuan/repos/RLinf/outputs/norm_stats
      asset_id: 50tasks_reorder
      # These norm stats were generated with the action-aligned state order
      # (left gripper at index 14), so the model must extract state the same way.
      state_order: align
      # PaliGemma SentencePiece tokenizer model (resolved from YAML, not hardcoded
      # in code).
      paligemma_tokenizer: /mnt/public/xzxuan/models/paligemma_tokenizer/paligemma_tokenizer.model
      discrete_state_input: true
      # Override the pi0_5_pytorch template's 200. The vlm_vla supervision
      # sequence is `Task: {instruction}. State: {32 discrete ints};\nSubtask:
      # {subtask}.` + EOS. Across all 50 tasks the long natural-language task
      # instructions (make_pizza is ~107 prompt tokens) plus the ~131-token state
      # block push the worst case to 257 tokens (make_pizza) -- well over 200, so
      # ~20 tasks overflowed and aborted the loader. 288 covers the 257 worst case
      # with headroom (and is a multiple of 32). This is also the model's prompt
      # token budget (pi0 builds fixed-length attention/KV tensors from it), so the
      # model and data pipeline both read this single value.
      max_token_len: 288
      mode: vlm_vla
      language_loss_weight: 1.0
      action_loss_weight: 10
      stop_gradient_to_vlm: False
      max_new_tokens: 24
      language_temperature: 0.0

  optim:
    lr: 2.5e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 50000
    lr_warmup_steps: 2000
    # Reference-exact warmup+cosine: warmup starts at peak/(warmup+1) and cosine
    # decays to min_lr over total_training_steps (matches openpi-comet-pytorch-mixed).
    lr_scheduler: "openpi_cosine"
    num_cycles: 0.5
    min_lr: 0.0

  fsdp_config:
    strategy: "fsdp"
    # FULL_SHARD across ranks, matching the reference trainer (degenerates to a
    # single shard on 1 GPU). FSDP MixedPrecision casts params to bf16 for compute;
    # gradient checkpointing is enabled on the dual-expert Gemma + SigLIP.
    sharding_strategy: "full_shard"
    use_orig_params: True
    gradient_checkpointing: True
    mixed_precision:
      # Match the reference recipe (init_model fsdp1 branch:
      # MixedPrecision(param_dtype=bf16, reduce_dtype=fp32)): bf16 compute, but the
      # gradient all-reduce and buffers stay fp32 so multi-rank grad accumulation is
      # not rounded to bf16. param_dtype is the FSDP COMPUTE dtype and is set
      # explicitly (bf16) rather than interpolated from actor.model.precision: the
      # load-dtype selector and the compute dtype are separate knobs, and coupling
      # them is a footgun (an fp32-master load must still compute in bf16).
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
