defaults:
  - model/pi0_5@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: sft
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "sft_pi05_vlm_only"
    logger_backends: ["tensorboard"]

  max_epochs: 20000
  max_steps: -1
  val_check_interval: 1000          # eval every N training steps
  save_interval: 2000               # must remain divisible by val_check_interval
  val_at_step_0: True               # also eval before training starts (untrained baseline)
  print_eval_samples: 5             # print K QA pairs per eval pass (rank 0, text only)

data:
  type: vlm
  dataset_name: "pi05_robo2vlm"
  train_data_paths: "/mnt/public/xzxuan/data/Robo2VLM/data"
  val_data_paths: "/mnt/public/xzxuan/data/Robo2VLM/eval_data"
  prompt_key: "question"
  choice_key: "choices"
  answer_key: "correct_answer"
  image_keys: ["image"]
  max_token_len: 200
  num_workers: 4

algorithm:
  adv_type: gae

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  eval_batch_size: 4
  global_batch_size: 256
  seed: 0

  model:
    precision: null  # pi0.5: different layers have different precision
    model_path: "/mnt/public/xzxuan/models/pi05_base_pytorch"
    add_value_head: False
    # num_action_chunks (10), action_dim (7), openpi.config_name ("pi05_libero")
    # are inherited from model/pi0_5.yaml defaults.
    openpi:
      num_images_in_input: 1            # Robo2VLM only has 1 image (default is 2)
      train_expert_only: False
      # Full pi0.5: VLM-only training (CE loss on language)
      full_pi05: True
      forward_mode: "vlm"
      max_language_len: 50
      language_temperature: 0.0
      language_loss_weight: 1.0
      action_loss_weight: 1.0

  optim:
    lr: 2.5e-5
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1e-10
    clip_grad: 1.0
    total_training_steps: 30000
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: True
    gradient_checkpointing: False  # pi0.5: must be False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
