# Two model nodes share rollout/actor/critic GPUs; a third hosts SAM3/envs.
defaults:
- train_qwen3.5_4b_libero_rl_ppo
- _self_
cluster:
  num_nodes: 3
  component_placement:
    actor: 0-15
    critic: 0-15
    rollout: 0-15
    reward: 0-15
    agentloop:
      node_group: node
      placement: 2:0-7
runner:
  experiment_name: rpent-libero-rl-qwen3.5-4b-2node
  max_epochs: 1
  max_steps: 40
  save_interval: 5
  synchronous: true
algorithm:
  sampling_params:
    presence_penalty: 1.5
    repetition_penalty: 1.0
data:
  train_data_paths:
  - /path/to/libero-rl-tasks/train.jsonl
  rollout_batch_size: 32
  shuffle: true
agentloop:
  episode_timeout_s: 14400
tools:
  rpent:
    python: /path/to/envs/rpent/bin/python
    libero_type: standard
    libero_config_path: /path/to/libero-standard-config
    sam3_endpoint: http://127.0.0.1:8101
    max_episode_steps: 10000
    env_gpus:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    episodes_per_worker: 8
    output_dir: /path/to/rlinf-episodes
    keep_episodes: all
    process_timeout_s: 15000
rollout:
  # SGLang memory saver is incompatible with expandable segments; set before startup.
  env_vars:
    PYTORCH_ALLOC_CONF: expandable_segments:False
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  model:
    model_path: /path/to/Qwen3.5-4B-SFT
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.3
  max_running_requests: 4
  sglang:
    context_length: 262144
    mamba_full_memory_ratio: 0.2
  replica_affinity: false
actor:
  trim_right_padding: true
  response_only_logits: true
  offload_weight: true
  offload_grad: true
  offload_optimizer: true
  model:
    attention_backend: flash
    tensor_model_parallel_size: 2
    context_parallel_size: 1
    sequence_parallel: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
  megatron:
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}
critic:
  trim_right_padding: true
  offload_weight: true
  offload_grad: true
  offload_optimizer: true
  model:
    attention_backend: flash
    tensor_model_parallel_size: 2
    context_parallel_size: 1
    sequence_parallel: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
  megatron:
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}
