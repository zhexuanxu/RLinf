# Adaptive multimodal PPO; deployment paths belong in the local profile.
defaults:
  - train_qwen3.5_4b_ppo
  - _self_

runner:
  experiment_name: rpent-libero-rl-qwen3.5-4b-ppo
  max_epochs: 10
  max_steps: -1
  save_interval: 5
  seq_length: 262144

algorithm:
  sampling_params:
    temperature: 1.0
    top_k: 20
    top_p: 0.95
    presence_penalty: 1.5
    repetition_penalty: 1.0
    max_new_tokens: 32768

data:
  train_data_paths: ???
  rollout_batch_size: 128
  shuffle: true

agentloop:
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
  observation_mode: adaptive
  prompt: simple
  max_turns: 100
  model_request_timeout_s: 3600
  episode_timeout_s: 14400
  history_compaction:
    max_messages: 80
    keep_messages: 40
    context_window: ${runner.seq_length}
    max_fraction: 0.7

tools:
  rpent:
    workflow: libero_rl
    python: ???
    vla_endpoint: null
    frozen_memory_dir: null
    libero_type: standard
    libero_config_path: ???
    max_episode_steps: 10000
    env_gpus: [0, 1, 2, 3, 4, 5, 6, 7]
    # Eight workers can run all 256 default SAO in-flight episodes.
    episodes_per_worker: 32
    # Limit cold-start pressure; reset environments release these permits.
    max_env_initializations_per_worker: 8
    output_dir: ???
    keep_episodes: all
    process_timeout_s: 15000

rollout:
  # The SGLang memory saver requires the non-expandable allocator.
  env_vars:
    PYTORCH_ALLOC_CONF: expandable_segments:False
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
  model:
    model_path: ???
  gpu_memory_utilization: 0.7
  max_running_requests: 128
  replica_affinity: false
  sglang:
    context_length: 262144
    mamba_full_memory_ratio: 0.2

actor:
  expect_multi_modal_inputs: true
  trim_right_padding: true
  model:
    attention_backend: flash
    freeze_vision_model: true
    freeze_vision_projection: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
  megatron:
    distributed_timeout_minutes: 180
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}

critic:
  trim_right_padding: true
  model:
    attention_backend: flash
    freeze_vision_model: true
    freeze_vision_projection: true
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
  megatron:
    distributed_timeout_minutes: 180
    ckpt_convertor:
      hf_model_path: ${rollout.model.model_path}
