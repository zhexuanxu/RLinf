# SAO changes the update rules and completion-based scheduling, not the task.
defaults:
  - train_qwen3.5_4b_libero_rl_ppo
  - _self_

runner:
  synchronous: false
  experiment_name: rpent-libero-rl-qwen3.5-4b-sao

algorithm:
  loss_type: dis
  clip_ratio_low: 0.3
  clip_ratio_high: 5.0
  adv_type: sao_gae
  gae_lambda_alpha: 1.5
  recompute_logprobs: false
  importance_sampling_fix: false
  n_minibatches: 1

agentloop:
  truncate_response: false

critic:
  loss_type: sao
  update_epochs: 2

rollout:
  max_weight_staleness: null
  # null resolves to twice data.rollout_batch_size in validate_cfg.
  max_in_flight_rollouts: null
  rollout_buffer_capacity: null
