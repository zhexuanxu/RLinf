defaults:
- train_qwen3.5_4b_libero_rl_ppo
- _self_
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
    critic: 0-7
    rollout: 0-7
    reward: 0-7
    agentloop:
      node_group: node
      placement: 0:0-7
runner:
  synchronous: false
  experiment_name: rpent-libero-rl-qwen3.5-4b-sao
  max_epochs: 4
  max_steps: 40
  save_interval: 20
  seq_length: 262144
algorithm:
  loss_type: dis
  clip_ratio_low: 0.3
  clip_ratio_high: 5.0
  adv_type: sao_gae
  gae_lambda_alpha: 1.5
  recompute_logprobs: false
  importance_sampling_fix: false
  n_minibatches: 1
agentloop:
  truncate_response: false
  max_turns: 100
  prompt: simple
critic:
  loss_type: sao
  update_epochs: 2
  model:
    tensor_model_parallel_size: 4
    context_parallel_size: 2
  offload_optimizer: false
  offload_weight: false
  offload_grad: false
data:
  rollout_batch_size: 16
tools:
  rpent:
    env_gpus:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    episodes_per_worker: 2
rollout:
  gpu_memory_utilization: 0.3
  max_running_requests: 16
  max_weight_staleness: null
  max_in_flight_rollouts: 16
  rollout_buffer_capacity: 16
actor:
  model:
    tensor_model_parallel_size: 4
    context_parallel_size: 2
  offload_optimizer: false
  offload_weight: false
  offload_grad: false
