defaults:
- train_qwen3.5_4b_libero_rl_local
- _self_
runner:
  experiment_name: rpent-libero-rl-qwen3.5-4b-smoke
  max_steps: 1
  save_interval: 1
data:
  rollout_batch_size: 1
agentloop:
  max_turns: 25
tools:
  rpent:
    episodes_per_worker: 1
    keep_episodes: all
rollout:
  max_in_flight_rollouts: 1
  rollout_buffer_capacity: 1
  max_running_requests: 1
actor:
  lr_sched:
    lr_warmup_fraction: 0.0
    lr_warmup_iters: 0
critic:
  lr_sched:
    lr_warmup_fraction: 0.0
    lr_warmup_iters: 0
