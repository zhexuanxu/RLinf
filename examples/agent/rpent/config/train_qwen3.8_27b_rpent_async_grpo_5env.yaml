defaults:
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

# 6-node (48x 80GB H100) Collocated Async GRPO for Qwen3.8-27B across all 5 RPent
# simulators (LIBERO, RoboTwin, RoboDojo, RoboLab, MetaWorld), paired with 1 dedicated
# 8-GPU Env+SAM3 node (see RPent/tools/rl/sim_services_5env_h100.example.yaml).
#
# Batch & quota policy:
# - rollout_batch_size = 32 groups, group_size = 4 => 128 trajectories/step
# - Guaranteed per-env floor: 4 groups (16 trajectories) x 5 envs = 20 groups
# - Remaining 12 groups: first-come-first-served (FCFS) across all 5 envs
#
# Parallelism & worker sizing:
# - Rollout (SGLang): TP=2 (24 independent NVLink replicas, ~29 GB weights/GPU,
#   ~26 GiB headroom during collocated weight sync vs ~10 MiB OOM at TP=1)
# - Actor (Megatron): TP=4, SP=true, CP=2, PP=1 (8 GPUs = 1 full NVLink node per
#   replica, DP=6 across 6 nodes; uneven-DP load balance + CP-aligned dummy rows)
# - AgentLoop: 18 async workers (0-17) <= max_inflight_groups=36 (~2 groups/worker,
#   0% idle, preventing Gloo recv timeouts on idle workers)
#
# Required runtime environment variables (set in launch script):
#   RPENT_ROOT        Shared workspace root containing repos/, envs/, data/, models/, runs/
#   RPENT_ENV_HOST    IP/hostname of the dedicated 5-env simulator + SAM3 node
#   RPENT_MODEL_PATH  Optional override for model checkpoint (default: ${RPENT_ROOT}/models/Qwen3.8-27B)
#   NCCL_IB_HCA       Optional RDMA HCA list (e.g. mlx5_0,mlx5_1,...); omitted when unset
#   NCCL_IB_GID_INDEX Optional RoCEv2 GID index; omitted when unset
#   NCCL_CROSS_NIC    Optional NCCL cross-NIC setting; omitted when unset

cluster:
  num_nodes: 6
  component_placement:
    actor: 0-47
    rollout: 0-47
    agentloop: 0-17
    reward: 0-47

runner:
  task_type: reasoning
  synchronous: false
  async_mode: true
  experiment_name: rpent-qwen3.8-27b-async-grpo-5env-v2
  output_dir: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/runs
  logger:
    log_path: ${runner.output_dir}/${runner.experiment_name}
    project_name: rlinf
    experiment_name: ${runner.experiment_name}
    logger_backends:
      - tensorboard
  max_epochs: 100
  max_steps: 200
  val_check_interval: -1
  save_interval: 5
  seq_length: 65536
  enable_dynamic_batch_size: false
  max_tokens_per_mbs: 32768
  resume_dir: null

algorithm:
  adv_type: grpo_dynamic
  advantage_mode: trajectory
  normalize_advantages: false
  group_size: 4
  n_minibatches: 1
  training_batch_size_per_gpu: 1
  rollout_batch_size_per_gpu: null
  logprob_forward_micro_batch_size: 1
  val_rollout_batch_size_per_gpu: 1
  recompute_logprobs: false
  importance_sampling_fix: false
  shuffle_rollout: false
  loss_type: actor
  loss_agg_func: token-mean
  loss_scales: []
  use_valid_token_scale: true
  kl_beta: 0.0
  kl_penalty_type: low_var_kl
  ratio_clip_eps: 0.2
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  clip_ratio_c: 3.0
  entropy_bonus: 0.0
  calculate_entropy: false
  early_stop_imp_ratio: 5.0
  down_sampling:
    do_down_sampling: false
  sampling_params:
    do_sample: true
    temperature: 1.0
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 16384
    min_new_tokens: 1
    presence_penalty: 0.0
    min_p: 0.0

data:
  type: reasoning
  max_prompt_length: 1792
  rollout_batch_size: 32
  sampling_batch_size: 36
  val_rollout_batch_size: null
  num_workers: 0
  prompt_key: prompt
  answer_key: answer
  apply_chat_template: false
  shuffle: true
  validation_shuffle: false
  seed: 1234
  train_data_paths: null
  val_data_paths: null

env:
  rpent:
    libero:
      endpoint: http://${oc.env:RPENT_ENV_HOST,127.0.0.1}:28561
      train_data_paths: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/data/libero/train.jsonl
      rollout_episodes: 16    # floor: 4 groups x 4 episodes
      sampling_episodes: 40   # max inflight: 10 groups x 4 episodes
    robotwin:
      endpoint: http://${oc.env:RPENT_ENV_HOST,127.0.0.1}:28562
      train_data_paths: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/data/robotwin/train.jsonl
      rollout_episodes: 16
      sampling_episodes: 32   # max inflight: 8 groups x 4 episodes
    robodojo:
      endpoint: http://${oc.env:RPENT_ENV_HOST,127.0.0.1}:28563
      train_data_paths: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/data/robodojo/train.jsonl
      rollout_episodes: 16
      sampling_episodes: 16   # max inflight: 4 groups x 4 episodes
    robolab:
      endpoint: http://${oc.env:RPENT_ENV_HOST,127.0.0.1}:28564
      train_data_paths: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/data/robolab/train.jsonl
      rollout_episodes: 16
      sampling_episodes: 16   # max inflight: 4 groups x 4 episodes
    metaworld:
      endpoint: http://${oc.env:RPENT_ENV_HOST,127.0.0.1}:28565
      train_data_paths: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/data/metaworld/ml45-train.jsonl
      rollout_episodes: 16
      sampling_episodes: 40   # max inflight: 10 groups x 4 episodes

rollout_buffer:
  max_inflight_groups: 36
  max_buffered_groups: 64
  max_dropped_groups_per_step: 320
  min_groups_per_task:
    libero: 4
    robotwin: 4
    robodojo: 4
    robolab: 4
    metaworld: 4
  max_inflight_per_task:
    libero: 10
    robotwin: 8
    robodojo: 4
    robolab: 4
    metaworld: 10

agentloop:
  group_name: AgentLoopGroup
  task_name: rpent
  toolcall_parser: qwen3.5
  agentic_tokenizer: qwen3_5
  chat_template_kwargs:
    enable_thinking: true
    preserve_thinking: true
  is_dynamic_rollout_batch: true
  print_outputs: false
  max_turns: 50
  episode_timeout_s: 7200
  max_actor_accept_staleness: 2
  merge_prefix_turns: true
  history_compaction:
    strategy: dynamic
    max_messages: null
    keep_messages: 10
    keep_recent_images: 4
    keep_recent_thinking: 4
    preserve_opening_images: true
    context_window: 65536
    max_tokens: 48000
    max_fraction: 0.75
    preserve_first_user_message: true
  max_infra_retries: 3
  max_infra_retry_rate: 1.0
  env_vars:
    PYTHONPATH: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/envs/rl-overlay:${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/repos/RLinf:${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/repos/RPent:/opt/venv/reason/Megatron-LM
    PATH: /opt/venv/reason/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    CUDA_HOME: /usr/local/cuda
    LD_LIBRARY_PATH: ${oc.env:RPENT_LD_LIBRARY_PATH,/usr/local/cuda/compat:/usr/lib/x86_64-linux-gnu:/usr/local/cuda/lib64}
    RLINF_TIMEOUT: "${oc.env:RLINF_TIMEOUT,28800}"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    NO_PROXY: ${oc.env:NO_PROXY,'127.0.0.1,localhost'}

tools:
  rpent:
    max_episode_steps: 10000
    episodes_per_worker: null
    output_dir: ${runner.logger.log_path}/episodes
    store_images_on_disk: true
    record_artifacts: false
    sleep_sim_pools_during_training: false
    remote_toolkit_endpoint: null
    max_actions_per_call: 3
    image_size: null      # libero/metaworld=512, robolab=768x432, robotwin=320x240, robodojo=640x480
    include_jaw_mm: true
    tool_timeout_s: 1800

rollout:
  group_name: RolloutGroup
  gpu_memory_utilization: 0.85
  pause_mode: retract
  model:
    model_path: ${oc.env:RPENT_MODEL_PATH,${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/models/Qwen3.8-27B}
    model_type: qwen3_5
    precision: bf16
  enforce_eager: true
  distributed_executor_backend: mp
  disable_log_stats: false
  detokenize: false
  padding: null
  eos: null
  return_logprobs: true
  replica_affinity: true
  rollout_backend: sglang
  sglang:
    backend_type: server
    enable_weights_cpu_backup: true
    enable_memory_saver: true
    attention_backend: triton
    decode_log_interval: 500000
    use_torch_compile: false
    torch_compile_max_bs: 32
    context_length: 65536
    mamba_full_memory_ratio: 0.2
    disable_overlap_schedule: true
    disable_radix_cache: false
    disable_fast_image_processor: true
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  max_running_requests: 12
  cuda_graph_max_bs: 12
  validate_weight: false
  validate_weight_first_sync: true
  validate_save_dir: null
  print_outputs: false
  env_vars:
    PYTHONPATH: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/envs/rl-overlay:${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/repos/RLinf:${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/repos/RPent:/opt/venv/reason/Megatron-LM
    PATH: /opt/venv/reason/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    CUDA_HOME: /usr/local/cuda
    LD_LIBRARY_PATH: ${oc.env:RPENT_LD_LIBRARY_PATH,/usr/local/cuda/compat:/usr/lib/x86_64-linux-gnu:/usr/local/cuda/lib64}
    RLINF_TIMEOUT: "${oc.env:RLINF_TIMEOUT,28800}"
    SGLANG_EXTERNAL_MM_PROCESSOR_PACKAGE: rlinf.hybrid_engines.sglang.multimodal
    SGLANG_MM_BUFFER_SIZE_MB: "0"
    PYTORCH_ALLOC_CONF: expandable_segments:False
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
    NCCL_MAX_CTAS: "8"
    NCCL_SOCKET_IFNAME: ${oc.env:NCCL_SOCKET_IFNAME,eth0}
    GLOO_SOCKET_IFNAME: ${oc.env:GLOO_SOCKET_IFNAME,eth0}
    NCCL_IB_HCA: ${oc.env:NCCL_IB_HCA,null}
    NCCL_IB_GID_INDEX: ${oc.env:NCCL_IB_GID_INDEX,null}
    NCCL_CROSS_NIC: ${oc.env:NCCL_CROSS_NIC,null}
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"

reward:
  group_name: RewardGroup
  use_reward_model: false
  reward_type: math
  reward_scale: 1.0
  tokenizer:
    tokenizer_model: ${actor.tokenizer.tokenizer_model}
    use_fast: false
    trust_remote_code: true
    padding_side: right

critic:
  use_critic_model: false

actor:
  group_name: ActorGroup
  training_backend: megatron
  mcore_gpt: true
  spec_name: decoder_gpt
  enable_dp_load_balance: true
  pack_traj: false
  response_only_logits: true
  seed: 1234
  offload_optimizer: true
  offload_weight: true
  offload_grad: true
  model:
    model_type: qwen3_5
    precision: bf16
    seq_length: ${runner.seq_length}
    encoder_seq_length: ${runner.seq_length}
    megatron_checkpoint: null
    activation: swiglu
    normalization: rmsnorm
    add_bias_linear: false
    position_embedding_type: rope
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    context_parallel_size: 2
    sequence_parallel: true
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    apply_rope_fusion: false
    bias_dropout_fusion: false
    persist_layer_norm: false
    bias_activation_fusion: false
    attention_softmax_in_fp32: true
    batch_p2p_comm: false
    variable_seq_lengths: true
    gradient_accumulation_fusion: false
    moe_token_dispatcher_type: alltoall
    use_cpu_initialization: false
    attention_backend: flash
    load_mtp: false
    freeze_vision_model: true
    freeze_vision_projection: true
  optim:
    optimizer: adam
    bf16: true
    fp16: false
    lr: 1.0e-06
    adam_beta1: 0.9
    adam_beta2: 0.98
    adam_eps: 1.0e-08
    min_lr: 0.0
    weight_decay: 0.0
    clip_grad: 1.0
    use_distributed_optimizer: true
    overlap_grad_reduce: false
    overlap_param_gather: false
    optimizer_enable_pin: false
    overlap_param_gather_with_optimizer_step: false
  lr_sched:
    lr_warmup_fraction: 0.0
    lr_warmup_init: 0.0
    lr_warmup_iters: 0
    max_lr: 1.0e-06
    min_lr: 0.0
    lr_decay_style: constant
    lr_decay_iters: 200
  tokenizer:
    tokenizer_model: ${rollout.model.model_path}
    use_fast: false
    trust_remote_code: true
    padding_side: right
  megatron:
    mbridge: true
    empty_cache_after_backward: true
    ddp_bucket_size: null
    distributed_backend: nccl
    distributed_timeout_minutes: 28800
    ckpt_format: torch
    use_dist_ckpt: false
    tp_comm_bootstrap_backend: nccl
    tp_comm_overlap_cfg: null
    use_hf_ckpt: true
    use_profiler: false
    ckpt_convertor:
      model: Qwen3.5-27B
      hf_model_path: ${rollout.model.model_path}
  multimodal:
    prefetch_batches: 2
    prefetch_bytes: 4294967296
    cleanup_after_step: true
  env_vars:
    PYTHONPATH: ${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/envs/rl-overlay:${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/repos/RLinf:${oc.env:RPENT_ROOT,/path/to/rpent_ppo}/repos/RPent:/opt/venv/reason/Megatron-LM
    PATH: /opt/venv/reason/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    CUDA_HOME: /usr/local/cuda
    LD_LIBRARY_PATH: ${oc.env:RPENT_LD_LIBRARY_PATH,/usr/local/cuda/compat:/usr/lib/x86_64-linux-gnu:/usr/local/cuda/lib64}
    RLINF_TIMEOUT: "${oc.env:RLINF_TIMEOUT,28800}"
    PYTORCH_ALLOC_CONF: expandable_segments:False
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:False
    NCCL_MAX_CTAS: "8"
    NCCL_SOCKET_IFNAME: ${oc.env:NCCL_SOCKET_IFNAME,eth0}
    GLOO_SOCKET_IFNAME: ${oc.env:GLOO_SOCKET_IFNAME,eth0}
    NCCL_IB_HCA: ${oc.env:NCCL_IB_HCA,null}
    NCCL_IB_GID_INDEX: ${oc.env:NCCL_IB_GID_INDEX,null}
    NCCL_CROSS_NIC: ${oc.env:NCCL_CROSS_NIC,null}
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
