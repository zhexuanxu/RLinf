defaults:
  - env/behavior_r1pro@env.eval
  - model/pi0_5_pytorch@rollout.model
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    rollout,env: all

runner:
  task_type: embodied_eval
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "behavior_openpi05_pytorch_vlm_vla_eval"
    logger_backends: ["tensorboard"]
  only_eval: true
  max_epochs: 1000
  max_steps: 1
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

env:
  group_name: "EnvGroup"
  eval:
    rollout_epoch: 4
    total_num_envs: 8
    max_episode_steps: 4096
    max_steps_per_rollout_epoch: 4096
    video_cfg:
      save_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
      fps: 15

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: true
  pipeline_stage_num: 1
  sampling_params:
    do_sample: false
    temperature_train: 1.0
    temperature_eval: 0.0
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    max_new_tokens: 24
  model:
    model_path: /mnt/public/xzxuan/repos/RLinf/outputs/sft_ckpt/vlm_vla_50k_sg_false_no_state
    add_value_head: false
    openpi:
      mode: vlm_vla
      state_token: none
      max_new_tokens: 24
      language_temperature: 0.0
