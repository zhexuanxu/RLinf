# Common rollout settings; inherit robot/camera/action defaults from the native
# env/robocasa365 group and all model settings from the same groups as SFT.
hydra:
  run:
    dir: .
  output_subdir: null
cluster:
  num_nodes: 1
  component_placement:
    env,rollout: all
runner:
  task_type: embodied_eval
  logger:
    project_name: robottt
    logger_backends: [tensorboard]
  max_epochs: 1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
env:
  group_name: EnvGroup
  enable_offload: false
  eval:
    task_soup: []
    task_mode: null
    task_sampling_strategy: ordered
    total_num_envs: 8
    episode_horizon_source: max_episode_steps
    max_steps_per_rollout_epoch: 64
    max_episode_steps: 64
    use_fixed_reset_state_ids: true
    is_eval: true
    seed: 7
    seed_strategy: global_unique
    video_cfg:
      save_video: true
    init_params:
      camera_heights: 256
      camera_widths: 256
    observation:
      state_layout: [base_pos, base_quat, base_to_eef_pos, base_to_eef_quat, gripper_qpos]
    action_space:
      binarize_gripper_control: false
    rollout_epoch: 2
    task_names: [BowlAndCup]
rollout:
  group_name: RolloutGroup
  rollout_backend: huggingface
  generation_backend: huggingface
  recompute_logprobs: false
  enable_offload: false
  pipeline_stage_num: 1
  cpu_threads: 4
  compiler_cache_dir: /home/xuzhexuan/project/robottt_runs/compiler_cache/native
  record_recurrent_state: true
